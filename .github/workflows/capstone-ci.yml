name: capstone-ci
on:
  push:
    paths: ['Capstone_week7/**', '.github/workflows/capstone-ci.yml']
  pull_request:
    paths: ['Capstone_week7/**', '.github/workflows/capstone-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Capstone_week7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Capstone_week7/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m levers.cache_hitrate
