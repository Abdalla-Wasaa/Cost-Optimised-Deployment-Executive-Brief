services:
  triage:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: capstone-week7:1.0.0
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PROVIDER: stub
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      BATCH_ENABLED: ${BATCH_ENABLED:-false}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-10}
      BATCH_WAIT_SECONDS: ${BATCH_WAIT_SECONDS:-0.005}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-600}
      CACHE_CAPACITY: ${CACHE_CAPACITY:-1024}
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:-100}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-3}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-2}
      RESERVATION_PER_ITEM_USD: ${RESERVATION_PER_ITEM_USD:-0.0001755}
      SPEND_CEILING_USD: ${SPEND_CEILING_USD:-1}
      SPEND_WINDOW_SECONDS: ${SPEND_WINDOW_SECONDS:-3600}
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 100
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    labels:
      project: capstone-week7
      environment: demo
      owner: capstone-maintainer
      cost-centre: education
